<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orbit Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&family=Literata:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#EDE7D9;
    --surface:#FBF8F0;
    --surface-2:#F3EEDF;
    --ink:#23271F;
    --ink-muted:#63665A;
    --line:#DCD4BE;
    --brass:#A9762E;
    --brass-strong:#8A5F22;
    --brass-tint:rgba(169,118,46,0.14);
    --teal:#2C6E6B;
    --teal-strong:#1F5350;
    --teal-tint:rgba(44,110,107,0.14);
    --shadow:0 18px 40px -22px rgba(34,30,15,0.35);
    --focus:#8A5F22;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181B;
      --surface:#1C2124;
      --surface-2:#20262A;
      --ink:#EDE9DC;
      --ink-muted:#9CA39B;
      --line:#2B3236;
      --brass:#D9A54A;
      --brass-strong:#EFC170;
      --brass-tint:rgba(217,165,74,0.16);
      --teal:#6FC3B4;
      --teal-strong:#8FD8CB;
      --teal-tint:rgba(111,195,180,0.16);
      --shadow:0 18px 44px -20px rgba(0,0,0,0.6);
      --focus:#EFC170;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181B;
    --surface:#1C2124;
    --surface-2:#20262A;
    --ink:#EDE9DC;
    --ink-muted:#9CA39B;
    --line:#2B3236;
    --brass:#D9A54A;
    --brass-strong:#EFC170;
    --brass-tint:rgba(217,165,74,0.16);
    --teal:#6FC3B4;
    --teal-strong:#8FD8CB;
    --teal-tint:rgba(111,195,180,0.16);
    --shadow:0 18px 44px -20px rgba(0,0,0,0.6);
    --focus:#EFC170;
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Literata", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:"Bricolage Grotesque", "Segoe UI", Arial, sans-serif;
    text-wrap:balance;
    margin:0;
  }
  .mono{ font-family:"JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
  a{color:inherit;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:2.5px solid var(--focus); outline-offset:2px;}

  .app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:16px clamp(16px,4vw,40px);
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:26px; height:26px; color:var(--brass); flex:none; }
  .brand-word{ font-weight:800; font-size:1.05rem; letter-spacing:0.01em; }
  .brand-word span{ color:var(--brass); }
  .crumbs{ font-size:0.78rem; color:var(--ink-muted); letter-spacing:0.04em; text-transform:uppercase; }
  .crumbs b{ color:var(--ink); font-weight:600; }

  /* ---------- Home ---------- */
  .home{
    flex:1;
    padding:clamp(28px,6vw,56px) clamp(16px,4vw,40px) 56px;
    max-width:1180px;
    margin:0 auto;
    width:100%;
  }
  .hero{ max-width:62ch; margin-bottom:clamp(28px,5vw,44px); }
  .hero .eyebrow{
    font-family:"JetBrains Mono", monospace;
    font-size:0.75rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--teal);
    display:block;
    margin-bottom:10px;
  }
  .hero h1{ font-size:clamp(1.8rem,3.6vw,2.7rem); line-height:1.12; font-weight:800; }
  .hero p{ margin:14px 0 0; color:var(--ink-muted); font-size:1.02rem; line-height:1.6; }

  .bench{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:18px;
  }
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 20px 20px;
    text-align:left;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:var(--shadow);
    transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  @media (prefers-reduced-motion:no-preference){
    .card:hover, .card:focus-visible{ transform:translateY(-4px); border-color:var(--brass); }
  }
  .card:hover, .card:focus-visible{ border-color:var(--brass); }
  .rivet{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-strong), var(--brass) 70%);
    opacity:0.75;
  }
  .rivet.tl{ top:10px; left:10px; } .rivet.tr{ top:10px; right:10px; }
  .rivet.bl{ bottom:10px; left:10px; } .rivet.br{ bottom:10px; right:10px; }
  .card-icon{ width:38px; height:38px; color:var(--teal); }
  .card h3{ font-size:1.18rem; font-weight:700; }
  .card .tag{
    font-family:"JetBrains Mono", monospace; font-size:0.68rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--brass-strong);
  }
  .card p{ margin:0; color:var(--ink-muted); font-size:0.9rem; line-height:1.55; }

  /* ---------- Module view ---------- */
  .module-view{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:16px;
    padding:clamp(16px,3vw,28px) clamp(16px,4vw,40px) 40px;
    max-width:1280px;
    margin:0 auto;
    width:100%;
  }
  .back-btn{
    align-self:flex-start;
    background:none; border:1px solid var(--line); border-radius:999px;
    padding:8px 16px 8px 12px; cursor:pointer; color:var(--ink-muted);
    font-size:0.85rem; display:flex; align-items:center; gap:6px;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .back-btn:hover{ border-color:var(--brass); color:var(--ink); }

  .workbench{
    display:flex;
    gap:18px;
    align-items:stretch;
  }
  @media (max-width:840px){ .workbench{ flex-direction:column; } }

  .stage-wrap{
    position:relative;
    flex:1.5;
    min-width:0;
    aspect-ratio:4/3;
    max-height:640px;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--line);
    background:
      radial-gradient(circle at 50% 40%, var(--surface-2) 0%, var(--bg) 78%);
    box-shadow:var(--shadow);
  }
  #stage{ width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #stage:active{ cursor:grabbing; }
  .viewport-hint{
    position:absolute; left:14px; bottom:12px;
    font-family:"JetBrains Mono", monospace; font-size:0.7rem;
    color:var(--ink-muted); background:color-mix(in srgb, var(--surface) 70%, transparent);
    padding:5px 9px; border-radius:999px; border:1px solid var(--line);
    pointer-events:none;
  }
  .module-eyebrow{
    position:absolute; top:14px; left:14px;
    font-family:"JetBrains Mono", monospace; font-size:0.68rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--brass-strong);
    background:color-mix(in srgb, var(--surface) 70%, transparent);
    padding:5px 9px; border-radius:999px; border:1px solid var(--line);
  }

  .notebook{
    flex:1;
    min-width:280px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:18px;
    box-shadow:var(--shadow);
  }
  .notebook h2{ font-size:1.35rem; font-weight:800; }
  .notebook .sub{ color:var(--ink-muted); font-size:0.85rem; margin-top:-10px; }

  .formula{
    font-family:"JetBrains Mono", monospace;
    font-size:1rem;
    background:var(--brass-tint);
    color:var(--brass-strong);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .formula b{ font-size:1.15rem; }

  .fact{ color:var(--ink-muted); font-size:0.92rem; line-height:1.6; margin:0; }
  .fact strong{ color:var(--ink); }

  .section-label{
    font-family:"JetBrains Mono", monospace; font-size:0.7rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--ink-muted);
  }

  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    border-radius:999px; padding:7px 14px; font-size:0.82rem; cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .chip[aria-pressed="true"]{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .chip:hover{ border-color:var(--teal); }

  .control{ display:flex; flex-direction:column; gap:6px; }
  .control .row{ display:flex; justify-content:space-between; align-items:baseline; }
  .control label{ font-size:0.85rem; color:var(--ink); }
  .control output{ font-family:"JetBrains Mono", monospace; font-size:0.8rem; color:var(--brass-strong); }

  input[type="range"]{
    -webkit-appearance:none; appearance:none; width:100%; height:4px;
    border-radius:999px; background:var(--line); outline-offset:4px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-strong), var(--brass));
    border:2px solid var(--surface); box-shadow:0 1px 4px rgba(0,0,0,0.35); cursor:pointer;
    margin-top:-1px;
  }
  input[type="range"]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%; border:2px solid var(--surface);
    background:radial-gradient(circle at 35% 30%, var(--brass-strong), var(--brass)); cursor:pointer;
  }
  input[type="range"]::-moz-range-track{ height:4px; border-radius:999px; background:var(--line); }

  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    border-radius:10px; padding:9px 16px; font-size:0.86rem; cursor:pointer;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    display:inline-flex; align-items:center; gap:7px;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .btn:hover{ border-color:var(--brass); }
  .btn.primary{ background:var(--brass); border-color:var(--brass); color:#20160a; font-weight:600; }
  .btn.primary:hover{ background:var(--brass-strong); border-color:var(--brass-strong); }

  .energy-bars{ display:flex; flex-direction:column; gap:8px; }
  .ebar{ display:flex; align-items:center; gap:10px; }
  .ebar .name{ width:34px; font-family:"JetBrains Mono",monospace; font-size:0.72rem; color:var(--ink-muted); }
  .ebar .track{ flex:1; height:9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; }
  .ebar .fill{ height:100%; border-radius:999px; width:0%; }
  .ebar.ke .fill{ background:var(--teal); }
  .ebar.pe .fill{ background:var(--brass); }

  .legend{ display:flex; flex-direction:column; gap:6px; max-height:190px; overflow-y:auto; padding-right:4px; }
  .legend-item{
    display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:9px;
    border:1px solid transparent; background:none; cursor:pointer; text-align:left; color:var(--ink);
  }
  .legend-item:hover{ border-color:var(--line); }
  .legend-item[aria-pressed="true"]{ background:var(--teal-tint); border-color:var(--teal); }
  .legend-dot{ width:11px; height:11px; border-radius:50%; flex:none; }
  .legend-item .lname{ font-weight:600; font-size:0.88rem; }
  .legend-item .lperiod{ margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:0.72rem; color:var(--ink-muted); }

  [hidden]{ display:none !important; }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="13" cy="13" r="3.6" fill="currentColor"/>
        <ellipse cx="13" cy="13" rx="12" ry="5.2" stroke="currentColor" stroke-width="1.4"/>
        <ellipse cx="13" cy="13" rx="12" ry="5.2" stroke="currentColor" stroke-width="1.4" transform="rotate(60 13 13)"/>
      </svg>
      <span class="brand-word">ORBIT <span>LAB</span></span>

      Workshop
    </button>
    <div class="workbench">
      <div class="stage-wrap">
        <span class="module-eyebrow" id="moduleEyebrow"></span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= Renderer / shared camera ================= */
  var canvas = document.getElementById('stage');
  var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

  function OrbitCam(){
    this.target = new THREE.Vector3(0,0,0);
    this.wantTarget = new THREE.Vector3(0,0,0);
    this.radius = 10; this.minRadius = 2; this.maxRadius = 40;
    this.theta = 0.7; this.phi = 1.1;
    this.dragging = false;
    this.lastX = 0; this.lastY = 0;
    this.moved = 0;
    this.onClick = null;
    var self = this;

    function ndc(e){
      var r = canvas.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      var cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
      return { x:(cx/r.width)*2-1, y:-(cy/r.height)*2+1 };
    }

    canvas.addEventListener('pointerdown', function(e){
      self.dragging = true; self.moved = 0;
      self.lastX = e.clientX; self.lastY = e.clientY;
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    });
    window.addEventListener('pointermove', function(e){
      if(!self.dragging) return;
      var dx = e.clientX - self.lastX, dy = e.clientY - self.lastY;
      self.lastX = e.clientX; self.lastY = e.clientY;
      self.moved += Math.abs(dx) + Math.abs(dy);
      self.theta -= dx * 0.006;
      self.phi = Math.min(2.95, Math.max(0.25, self.phi - dy * 0.006));
    });
    window.addEventListener('pointerup', function(e){
      if(!self.dragging) return;
      self.dragging = false;
      if(self.moved < 5 && self.onClick){
        var p = ndc(e);
        self.onClick(p.x, p.y);
      }
    });
    canvas.addEventListener('wheel', function(e){
      e.preventDefault();
      self.radius = Math.min(self.maxRadius, Math.max(self.minRadius, self.radius + e.deltaY * 0.01 * (self.radius*0.06+0.4)));
    }, { passive:false });

    this.reset = function(opts){
      opts = opts || {};
      this.target.set.apply(this.target, opts.target || [0,0,0]);
      this.wantTarget.copy(this.target);
      this.radius = opts.radius || 10;
      this.minRadius = opts.minRadius != null ? opts.minRadius : this.radius*0.3;
      this.maxRadius = opts.maxRadius != null ? opts.maxRadius : this.radius*3;
      this.theta = opts.theta != null ? opts.theta : 0.7;
      this.phi = opts.phi != null ? opts.phi : 1.1;
      this.onClick = opts.onClick || null;
    };
    this.update = function(){
      this.target.lerp(this.wantTarget, 0.12);
      var x = this.target.x + this.radius * Math.sin(this.phi) * Math.sin(this.theta);
      var y = this.target.y + this.radius * Math.cos(this.phi);
      var z = this.target.z + this.radius * Math.sin(this.phi) * Math.cos(this.theta);
      camera.position.set(x,y,z);
      camera.lookAt(this.target);
    };
  }
  var orbitCam = new OrbitCam();

  var raycaster = new THREE.Raycaster();

  /* ================= helpers ================= */
  function bondMesh(a, b, radius, color){
    var dir = new THREE.Vector3().subVectors(b,a);
    var len = dir.length();
    var geo = new THREE.CylinderGeometry(radius, radius, len, 10);
    var mat = new THREE.MeshStandardMaterial({ color:color, roughness:0.5, metalness:0.05 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(a).add(b).multiplyScalar(0.5);
    var quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
    mesh.quaternion.copy(quat);
    return mesh;
  }
  function circlePoints(r, n){
    var pts = [];
    for(var i=0;i<=n;i++){ var a = (i/n)*Math.PI*2; pts.push(new THREE.Vector3(r*Math.cos(a),0,r*Math.sin(a))); }
    return pts;
  }
  function sceneLights(scene, opts){
    opts = opts || {};
    var amb = new THREE.AmbientLight(0xffffff, opts.ambient != null ? opts.ambient : 0.55);
    var dir = new THREE.DirectionalLight(0xfff2d8, opts.dir != null ? opts.dir : 0.9);
    dir.position.set(4,6,5);
    scene.add(amb, dir);
  }
  function svgEl(paths, viewBox){
    var s = 'data:image/svg+xml,';
    return s;
  }

  /* ============================================================
     MODULE 1 — PHYSICS: Pendulum
     ============================================================ */
  var Pendulum = (function(){
    var scene = new THREE.Scene();
    sceneLights(scene, { ambient:0.6, dir:0.85 });

    var pivotY = 2.6;
    var group = new THREE.Group();
    scene.add(group);

    var rodMat = new THREE.MeshStandardMaterial({ color:0x8a6a3a, metalness:0.4, roughness:0.35 });
    var bobMat = new THREE.MeshStandardMaterial({ color:0x2c6e6b, metalness:0.15, roughness:0.35 });
    var pivotMat = new THREE.MeshStandardMaterial({ color:0xa9762e, metalness:0.5, roughness:0.3 });

    var pivot = new THREE.Mesh(new THREE.SphereGeometry(0.12,20,16), pivotMat);
    pivot.position.set(0, pivotY, 0);
    group.add(pivot);

    var support = new THREE.Mesh(new THREE.BoxGeometry(2.4,0.12,0.12), rodMat);
    support.position.set(0, pivotY+0.06, 0);
    group.add(support);

    var rod = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1,10), rodMat);
    group.add(rod);
    var bob = new THREE.Mesh(new THREE.SphereGeometry(0.26,24,20), bobMat);
    group.add(bob);

    var trailMax = 70;
    var trailPts = [];
    var trailGeo = new THREE.BufferGeometry();
    var trailMat = new THREE.LineBasicMaterial({ color:0x2c6e6b, transparent:true, opacity:0.5 });
    var trailLine = new THREE.Line(trailGeo, trailMat);
    scene.add(trailLine);

    var grid = new THREE.GridHelper(8, 16, 0x8a6a3a, 0xd8d0bc);
    grid.position.y = -0.9;
    grid.material.transparent = true; grid.material.opacity = 0.22;
    scene.add(grid);

    var state = { L:2.0, g:9.8, theta0:40, theta:0, omega:0, running:true };

    function resetPhysics(){
      state.theta = state.theta0 * Math.PI/180;
      state.omega = 0;
      trailPts = [];
    }
    resetPhysics();

    function layout(){
      var scale = 1.5;
      var bx = pivot.position.x + state.L*scale*Math.sin(state.theta);
      var by = pivotY - state.L*scale*Math.cos(state.theta);
      rod.position.set(bx*0.5, (pivotY+by)*0.5, 0);
      var dir = new THREE.Vector3(bx,by,0).sub(new THREE.Vector3(0,pivotY,0));
      rod.scale.y = dir.length();
      rod.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
      bob.position.set(bx,by,0);

      trailPts.push(new THREE.Vector3(bx,by,0.001));
      if(trailPts.length > trailMax) trailPts.shift();
      trailGeo.setFromPoints(trailPts);
    }
    layout();

    var els = {};
    function html(){
      return (
        '<h2>Pendulum</h2>' +
        '<p class="sub">A swinging bob converts height into speed and back again — the same rhythm behind clocks and metronomes.</p>' +

      id:'orrery', name:'Orrery', tag:'Astronomy · Orbits',
      desc:'Watch six planets keep real relative time.',
      icon:'<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="3.4" fill="currentColor"/><ellipse cx="20" cy="20" rx="15" ry="6.2" stroke="currentColor" stroke-width="1.8"/><circle cx="33" cy="20" r="2" fill="currentColor"/></svg>',
      scene:scene,
      view:{ target:[0,0,0], radius:15, theta:0.6, phi:1.05, minRadius:4, maxRadius:28, onClick:null },
      html:html, wire:wire, update:update,
      onEnter:function(){ orbitCam.onClick = null; }, onExit:function(){ selected=null; orbitCam.onClick=null; }
    };
  })();

  /* ================= App shell / router ================= */
  var MODULES = [Pendulum, Molecule, Solids, Orrery];
  var bench = document.getElementById('bench');
  var home = document.getElementById('home');
  var moduleView = document.getElementById('moduleView');
  var notebook = document.getElementById('notebook');
  var crumbs = document.getElementById('crumbs');
  var moduleEyebrow = document.getElementById('moduleEyebrow');
  var backBtn = document.getElementById('backBtn');

  MODULES.forEach(function(m){
    var card = document.createElement('button');
    card.className = 'card'; card.type = 'button'; card.setAttribute('role','listitem');
    card.innerHTML =
      '<span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>' +
      '<span class="card-icon">'+m.icon+'</span>' +
      '<span class="tag">'+m.tag+'</span>' +
      '<h3>'+m.name+'</h3>' +
      '<p>'+m.desc+'</p>';
    card.addEventListener('click', function(){ openModule(m.id); });
    bench.appendChild(card);
  });

  var active = null;

  function openModule(id){
    var m = MODULES.filter(function(x){ return x.id===id; })[0];
    if(!m) return;
    active = m;
    home.hidden = true; moduleView.hidden = false;
    crumbs.innerHTML = 'Workshop <span aria-hidden="true">/</span> <b>'+m.name+'</b>';
    moduleEyebrow.textContent = m.tag;
    notebook.innerHTML = m.html();
    m.wire(notebook);
    orbitCam.reset(m.view);
    m.onEnter();
    resize();
    history.replaceState(null,'','#'+id);
  }
  function showHome(){
    active = null;
    moduleView.hidden = true; home.hidden = false;
    crumbs.textContent = 'Workshop';
    MODULES.forEach(function(m){ m.onExit(); });
    history.replaceState(null,'',location.pathname+location.search);
  }
  backBtn.addEventListener('click', showHome);

  /* ================= resize ================= */
  var stageWrap = document.querySelector('.stage-wrap');
  function resize(){
    var w = stageWrap.clientWidth, h = stageWrap.clientHeight;
    if(w<1||h<1) return;
    renderer.setSize(w,h,false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  if(window.ResizeObserver){ new ResizeObserver(resize).observe(stageWrap); }
  window.addEventListener('resize', resize);

  /* ================= loop ================= */
  var lastT = performance.now();
  function frame(t){
    var dt = Math.min(0.05, (t-lastT)/1000);
    lastT = t;
    if(active){
      active.update(dt);
      orbitCam.update();
      resize();
      renderer.render(active.scene, camera);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ================= hot state (best-effort) ================= */
  function start(data){
    var id = (data && data.moduleId) || (location.hash ? location.hash.slice(1) : null);
    if(id && MODULES.some(function(m){ return m.id===id; })){ openModule(id); }
    try{
      window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(function(){
        return { moduleId: active ? active.id : null };
      });
    }catch(e){}
  }
  try{
    if(window.claude && window.claude.hot && window.claude.hot.ready){
      window.claude.hot.ready(start);
    } else {
      start(window.claude && window.claude.hot ? window.claude.hot.data : null);
    }
  }catch(e){ start(null); }
})();
</script>

</body></html>
